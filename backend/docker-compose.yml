# Infraestrutura de apoio: InfluxDB, Grafana e Node-RED.
# O backend (Node.js) e o frontend (React) NÃO correm em contentores: arrancam com npm (ver README).
#
# Corre a partir desta pasta (backend/). O Compose lê automaticamente o ficheiro .env que está aqui
# (o mesmo que o backend usa; NÃO versionado). Antes de `docker compose up -d` define nele:
#   INFLUXDB_INIT_PASSWORD e GRAFANA_ADMIN_PASSWORD   (ver .env.example)
# Usa valores fortes e nunca reutilizes a password do dashboard.
# Se alguma password no .env contiver o carácter $, põe o valor entre aspas simples: o Compose
# interpreta $ como interpolação de variáveis.

services:
  # ==========================================
  # Node-RED (Opcional)
  # ==========================================
  # O fluxo backend/nodered-flow-optimized.json não é carregado automaticamente:
  # importa-o no editor (http://localhost:1880 → menu → Import).
  # Lê as credenciais TinyGS do ambiente (${TINYGS_USER_SECONDARY} / ${TINYGS_PASS_SECONDARY}).
  nodered:
    image: nodered/node-red:latest
    container_name: gs-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Lisbon
      - TINYGS_USER_SECONDARY=${TINYGS_USER_SECONDARY:-}
      - TINYGS_PASS_SECONDARY=${TINYGS_PASS_SECONDARY:-}
    volumes:
      - nodered-data:/data
    networks:
      - gs-network

  # ==========================================
  # InfluxDB (Opcional - para armazenamento)
  # ==========================================
  influxdb:
    image: influxdb:2.7
    container_name: gs-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD:?define INFLUXDB_INIT_PASSWORD no .env}
      - DOCKER_INFLUXDB_INIT_ORG=groundstation
      - DOCKER_INFLUXDB_INIT_BUCKET=satellite-data
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - gs-network

  # ==========================================
  # Grafana (Opcional - para visualização)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: gs-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD no .env}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - gs-network

networks:
  gs-network:
    driver: bridge

volumes:
  nodered-data:
  influxdb-data:
  grafana-data:
